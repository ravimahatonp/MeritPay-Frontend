name: Bug report
description: Something in the frontend is broken or behaves incorrectly
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please **do not report security vulnerabilities here** —
        see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I ..., I expected ..., but instead ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console / network output
      description: Paste relevant errors. Redact any private values (hours, salaries, salts, addresses, keys).
      render: shell
    validations:
      required: false
  - type: dropdown
    id: route
    attributes:
      label: Which page?
      options:
        - / (landing)
        - /employer
        - /verify
        - /employee
        - /auditor
        - Multiple / not sure
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, browser + version, Freighter version, Node version, and whether a wallet was connected.
      placeholder: macOS 15 · Chrome 128 · Freighter 5.x · Node 20 · wallet connected (Testnet)
    validations:
      required: true
  - type: dropdown
    id: config
    attributes:
      label: Configuration
      options:
        - Fresh .env.local with real contract IDs
        - No .env.local (defaults)
        - Custom / modified
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
        - label: I can reproduce this on the latest `main`
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true
